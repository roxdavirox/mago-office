name: AI Code Review

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize]

jobs:
  review:
    name: AI Review
    runs-on: self-hosted
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run AI Code Review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          unset CLAUDECODE || true
          ./scripts/pr-review.sh "$PR_NUMBER" --post
